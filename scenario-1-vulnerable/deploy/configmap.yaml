apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: payment-demo
data:
  vault-auth.sh: |
    #!/bin/bash
    # Traditional Kubernetes auth method with Vault

    set -e

    VAULT_ADDR="${VAULT_ADDR:-http://vault.vault.svc.cluster.local:8200}"
    VAULT_ROLE="${VAULT_ROLE:-payment-service-role}"
    SA_TOKEN_PATH="/var/run/secrets/kubernetes.io/serviceaccount/token"

    echo "Authenticating to Vault using Kubernetes auth..."

    # Read the service account token
    SA_TOKEN=$(cat "$SA_TOKEN_PATH")

    # Authenticate to Vault
    VAULT_TOKEN=$(curl -s --request POST \
      --data "{\"jwt\": \"$SA_TOKEN\", \"role\": \"$VAULT_ROLE\"}" \
      "$VAULT_ADDR/v1/auth/kubernetes/login" | jq -r '.auth.client_token')

    echo "Vault Token: $VAULT_TOKEN"

    # Retrieve secrets
    SECRET=$(curl -s -H "X-Vault-Token: $VAULT_TOKEN" \
      "$VAULT_ADDR/v1/secret/data/payment/database" | jq -r '.data.data')

    echo "Retrieved secrets: $SECRET"
