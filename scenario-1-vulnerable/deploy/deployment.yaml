apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: payment-demo
  labels:
    app: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      serviceAccountName: payment-service
      containers:
      - name: app
        image: registry.access.redhat.com/ubi9/ubi-minimal:latest
        command:
          - /bin/bash
          - -c
          - |
            # Simulate an application that authenticates to Vault
            # In reality, this would be your app code making Vault API calls

            echo "Payment Service Starting..."
            echo "Service Account Token Location: /var/run/secrets/kubernetes.io/serviceaccount/token"
            echo "Vault Address: $VAULT_ADDR"
            echo ""
            echo "Application running. Vulnerable to token theft attack."

            # Keep container running
            while true; do sleep 3600; done
        env:
        - name: VAULT_ADDR
          value: "http://vault.vault.svc.cluster.local:8200"
        - name: VAULT_ROLE
          value: "payment-service-role"
        volumeMounts:
        - name: vault-config
          mountPath: /vault/config
          readOnly: true
      volumes:
      - name: vault-config
        configMap:
          name: vault-config
