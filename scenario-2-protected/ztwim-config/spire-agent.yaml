apiVersion: spire.openshift.io/v1
kind: SPIREAgent
metadata:
  name: spire-agent
  namespace: spire
spec:
  # Reference to SPIRE Server
  spireServer:
    name: spire-server
    namespace: spire

  # Workload attestation configuration
  workloadAttestors:
    # Kubernetes workload attestor
    - k8s:
        enabled: true
        # Attestation options
        disableContainerSelectors: false
        useNewContainerLocator: true

    # Unix attestor (for processes)
    - unix:
        enabled: true

  # Node attestation (how agent proves itself to server)
  nodeAttestor:
    k8sPsat:
      enabled: true
      cluster: openshift-cluster

  # Socket path for Workload API
  workloadAPI:
    socketPath: /run/spire/sockets/agent.sock
    # This socket is mounted into workload pods
    # Applications use it to request JWT-SVIDs

  # Agent configuration
  agent:
    # Trust domain must match server
    trustDomain: cluster.local

    # Agent will run as DaemonSet
    daemonSet:
      enabled: true
      # Tolerations to run on all nodes
      tolerations:
        - operator: Exists
