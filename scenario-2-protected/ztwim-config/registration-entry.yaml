apiVersion: spire.openshift.io/v1
kind: RegistrationEntry
metadata:
  name: payment-service-entry
  namespace: spire
spec:
  # SPIFFE ID assigned to this workload
  spiffeId: spiffe://cluster.local/ns/payment-demo/sa/payment-service

  # Parent ID (the SPIRE Agent that will attest this workload)
  parentId: spiffe://cluster.local/spire/agent/k8s_psat/openshift-cluster

  # Selectors: criteria that must match for this SPIFFE ID to be assigned
  selectors:
    - type: k8s
      value: ns:payment-demo
    - type: k8s
      value: sa:payment-service

  # JWT-SVID configuration
  jwt:
    enabled: true
    # Audiences that can be requested
    audiences:
      - vault
      - vault.vault.svc.cluster.local

  # X.509-SVID also enabled (for mTLS if needed)
  x509:
    enabled: true
    ttl: 5m
    dns:
      - payment-service
      - payment-service.payment-demo
      - payment-service.payment-demo.svc.cluster.local

---
# Additional registration entries can be added for other services
# Example: Database service
apiVersion: spire.openshift.io/v1
kind: RegistrationEntry
metadata:
  name: database-service-entry
  namespace: spire
spec:
  spiffeId: spiffe://cluster.local/ns/payment-demo/sa/database-service
  parentId: spiffe://cluster.local/spire/agent/k8s_psat/openshift-cluster
  selectors:
    - type: k8s
      value: ns:payment-demo
    - type: k8s
      value: sa:database-service
  jwt:
    enabled: true
    audiences:
      - vault
  x509:
    enabled: true
    ttl: 5m
