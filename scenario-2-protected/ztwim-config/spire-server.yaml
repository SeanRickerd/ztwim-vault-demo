apiVersion: spire.openshift.io/v1
kind: SPIREServer
metadata:
  name: spire-server
  namespace: spire
spec:
  # OIDC Discovery configuration for Vault integration
  oidc:
    enabled: true
    service:
      type: ClusterIP
      # This creates a service at: spire-oidc.spire.svc.cluster.local
      # Vault will use this for OIDC discovery

  # Trust domain for SPIFFE IDs
  trustDomain: cluster.local

  # Server configuration
  server:
    ca:
      # Use automatic CA generation
      generate: true
      ttl: 24h

    jwt:
      # JWT-SVID configuration
      ttl: 5m  # Short-lived tokens (5 minutes)

  # Datastore (for production, use PostgreSQL)
  dataStore:
    sql:
      databaseType: sqlite3
      connectionString: /run/spire/data/datastore.sqlite3

  # Registration entries will be created separately
  # to map service accounts to SPIFFE IDs
